<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Morse Trainer</title>
    <meta
      name="description"
      content="Morse code trainer — key dits and dahs on a PCB dichotomous chart, drill CW shorthand, and listen to phrases keyed."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee&family=IBM+Plex+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <!-- Morse trainer (mobile-first) -->
    <div id="page-morse" class="page page-morse">
      <div class="morse-page">
        <header class="morse-page-header">
          <h1 class="morse-page-title">Morse Trainer</h1>
          <div class="morse-mode-toggle" role="group" aria-label="Trainer mode">
            <button type="button" class="morse-mode-btn" data-mode="free" aria-pressed="true">Free key</button>
            <button type="button" class="morse-mode-btn" data-mode="practice" aria-pressed="false">Practice</button>
            <button type="button" class="morse-mode-btn" data-mode="listen" aria-pressed="false">Listen</button>
          </div>
        </header>

        <div class="morse-panel">
          <section id="morse-practice" class="morse-practice" aria-label="Send practice" hidden>
            <div class="mp-config"></div>
            <p class="mp-live" aria-live="polite"></p>
            <div class="mp-test">
              <p class="mp-gloss"></p>
              <div class="mp-words" aria-live="polite"></div>
              <p class="mp-next" hidden></p>
              <p class="mp-upnext"></p>
            </div>
            <div class="mp-results" hidden>
              <div class="mp-stats"></div>
              <canvas class="mp-chart" aria-label="Words per minute over time with error markers"></canvas>
              <div class="mp-misses"></div>
            </div>
            <div class="mp-listen-config mp-config" hidden></div>
            <div class="mp-actions">
              <button type="button" class="btn ghost mp-restart">Restart</button>
              <button type="button" class="btn mp-listen" title="Hear and watch the phrase keyed (L)">Listen</button>
              <button type="button" class="btn ghost mp-listen-toggle" aria-expanded="false" title="Listen settings">Speed…</button>
              <span class="mp-restart-hint"><kbd>Tab</kbd> restart · <kbd>L</kbd> listen</span>
            </div>
          </section>

          <section id="morse-listen" class="morse-listen" aria-label="Listen and watch" hidden>
            <div class="ml-config mp-config"></div>
            <div class="ml-picker mp-config"></div>
            <p class="ml-gloss mp-gloss"></p>
            <div class="ml-phrase" aria-live="polite"></div>
            <canvas class="ml-strip" aria-label="Rhythm strip: dits and dahs to scale"></canvas>
            <p class="ml-info"></p>
            <div class="ml-controls">
              <button type="button" class="btn primary ml-play">Play</button>
              <button type="button" class="btn ml-loop" aria-pressed="false">Loop</button>
              <button type="button" class="btn ghost ml-keyit">Key it now</button>
            </div>
            <p class="ml-help"><kbd>Space</kbd> play / stop · <kbd>←</kbd> <kbd>→</kbd> phrase · <kbd>M</kbd> mute</p>
          </section>

          <div class="morse-readout">
            <p class="morse-label">Decoded</p>
            <p id="morse-message" class="morse-message">—</p>
            <p id="morse-status" class="morse-status">Hold Key or tap Dit / Dah</p>
          </div>

          <div class="morse-controls morse-controls-secondary">
            <button type="button" id="btn-morse-mute" class="btn" aria-pressed="false">Mute</button>
            <button type="button" id="btn-morse-record" class="btn" aria-pressed="false">Record</button>
            <button type="button" id="btn-morse-play" class="btn">Play</button>
            <button type="button" id="btn-morse-clear" class="btn ghost">Clear</button>
          </div>
        </div>

        <div class="morse-dock">
          <div id="morse-board" class="morse-board" aria-live="polite"></div>
          <div class="morse-controls morse-controls-primary">
            <button type="button" id="btn-morse-dah" class="btn morse-element">Dah −</button>
            <button type="button" id="btn-morse-key" class="btn primary morse-paddle">Key</button>
            <button type="button" id="btn-morse-dit" class="btn morse-element">Dit ·</button>
          </div>
          <p class="panel-help morse-help">
            Hold <kbd>Space</kbd> / Key · tap Dit / Dah · <kbd>.</kbd> <kbd>-</kbd> ·
            <kbd>M</kbd> mute
          </p>
        </div>

        <aside id="morse-reference" class="morse-reference" aria-label="Code chart"></aside>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
